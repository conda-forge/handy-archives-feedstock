{% set name = "handy-archives" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 2a8d125cd9c42433b978384834f4a1df184a9e3bab68bf440df184b6dae12ff3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - flit-core >=3.2,<4
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  imports:
    - handy_archives
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/domdfcoding/handy-archives/
  summary: Some handy archive helpers for Python.
  license: MIT
  license_file: LICENSE
  doc_url: https://handy-archives.readthedocs.io/en/latest

extra:
  recipe-maintainers:
    - domdfcoding
